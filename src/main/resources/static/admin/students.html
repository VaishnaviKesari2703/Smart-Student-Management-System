<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | Smart Student Management System</title>
    <meta name="description" content="Search, filter, view, edit and delete student records.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="sidebar" aria-label="Main navigation"></nav>
<main class="main">
    <div class="topbar-mobile">
        <button class="btn btn-outline-secondary" id="menu-toggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <strong>Smart Student Management</strong>
    </div>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
            <h1 class="page-title">Student Management</h1>
            <p class="page-sub">View, search, filter, edit and delete student records.</p>
        </div>
        <a href="/admin/student-form.html" class="btn btn-brand" id="add-student-btn"><i class="bi bi-person-plus me-1"></i>Add Student</a>
    </div>

    <div class="card-soft mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-12 col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="search" id="search" class="form-control" placeholder="Search by registration number or name">
                    </div>
                </div>
                <div class="col-6 col-md-3"><select id="filter-dept" class="form-select" aria-label="Department filter"><option value="">All departments</option></select></div>
                <div class="col-6 col-md-2"><select id="filter-sem" class="form-select" aria-label="Semester filter"><option value="">All semesters</option></select></div>
                <div class="col-12 col-md-2"><button type="button" class="btn btn-outline-secondary w-100" id="reset-filters"><i class="bi bi-x-circle me-1"></i>Reset</button></div>
            </div>
        </div>
    </div>

    <div class="card-soft">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0" id="students-table">
                    <thead><tr><th>Registration Number</th><th>Student Name</th><th>Department</th><th>Classes Attended</th><th>Attendance %</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="students-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <p class="text-secondary small mt-2" id="result-count"></p>
</main>

<div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:16px">
        <div class="modal-header border-0"><h2 class="modal-title fs-5">Delete student</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">Delete <strong id="delete-name"></strong> and all of their login, attendance and history records? This cannot be undone.</div>
        <div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" id="confirm-delete"><i class="bi bi-trash me-1"></i>Delete</button></div>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let pendingDelete = null;
    let modal;

    function buildQuery() {
        const p = new URLSearchParams();
        const q = document.getElementById('search').value.trim();
        const d = document.getElementById('filter-dept').value;
        const s = document.getElementById('filter-sem').value;
        if (q) p.set('q', q);
        if (d) p.set('department', d);
        if (s) p.set('semester', s);
        return p.toString();
    }

    async function loadFilterOptions() {
        const all = await api.get('/api/students');
        const depts = [...new Set(all.map(s => s.department))].sort();
        const sems = [...new Set(all.map(s => s.semester))].sort((a, b) => a - b);
        const dSel = document.getElementById('filter-dept'), sSel = document.getElementById('filter-sem');
        const dv = dSel.value, sv = sSel.value;
        dSel.innerHTML = '<option value="">All departments</option>' + depts.map(d => '<option>' + esc(d) + '</option>').join('');
        sSel.innerHTML = '<option value="">All semesters</option>' + sems.map(s => '<option value="' + s + '">Semester ' + s + '</option>').join('');
        dSel.value = dv; sSel.value = sv;
    }

    async function load() {
        const list = await api.get('/api/students?' + buildQuery());
        const body = document.getElementById('students-body');
        document.getElementById('result-count').textContent = list.length + ' student' + (list.length === 1 ? '' : 's') + ' shown';
        if (!list.length) {
            body.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="bi bi-search"></i>No students match your search.</div></td></tr>';
            return;
        }
        body.innerHTML = list.map(s => {
            const id = encodeURIComponent(s.id);
            return '<tr><td class="fw-semibold">' + esc(s.registrationNumber) + '</td><td>' + esc(s.fullName) + '</td><td>' + esc(s.department)
                + '</td><td>' + s.attendance.classesAttended + ' / ' + s.attendance.totalClasses + '</td>'
                + '<td style="min-width:150px"><div class="fw-semibold mb-1">' + s.attendance.percentage.toFixed(2) + '%</div>' + progressBar(s.attendance) + '</td>'
                + '<td>' + statusBadge(s.attendance) + '</td>'
                + '<td class="text-end text-nowrap">'
                + '<a class="btn btn-sm btn-outline-primary btn-icon me-1" title="View" aria-label="View ' + esc(s.fullName) + '" href="/admin/student-profile.html?id=' + id + '"><i class="bi bi-eye"></i></a>'
                + '<a class="btn btn-sm btn-outline-secondary btn-icon me-1" title="Edit" aria-label="Edit ' + esc(s.fullName) + '" href="/admin/student-form.html?id=' + id + '"><i class="bi bi-pencil"></i></a>'
                + '<button class="btn btn-sm btn-outline-danger btn-icon btn-delete" title="Delete" aria-label="Delete ' + esc(s.fullName) + '" data-id="' + esc(s.id) + '" data-name="' + esc(s.fullName) + '"><i class="bi bi-trash"></i></button>'
                + '</td></tr>';
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
        modal = new bootstrap.Modal(document.getElementById('delete-modal'));
        document.getElementById('students-body').addEventListener('click', e => {
            const b = e.target.closest('.btn-delete');
            if (!b) return;
            pendingDelete = b.dataset.id;
            document.getElementById('delete-name').textContent = b.dataset.name;
            modal.show();
        });
        document.getElementById('confirm-delete').addEventListener('click', async () => {
            try {
                await api.del('/api/students/' + encodeURIComponent(pendingDelete));
                modal.hide();
                toast('Student deleted.', 'success');
                await loadFilterOptions();
                await load();
            } catch (e) { toast(e.message, 'error'); }
        });
        const reload = debounce(() => load().catch(e => toast(e.message, 'error')), 250);
        document.getElementById('search').addEventListener('input', reload);
        document.getElementById('filter-dept').addEventListener('change', reload);
        document.getElementById('filter-sem').addEventListener('change', reload);
        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('search').value = '';
            document.getElementById('filter-dept').value = '';
            document.getElementById('filter-sem').value = '';
            load();
        });
        initLayout('ADMIN', 'students').then(async me => {
            if (!me) return;
            await loadFilterOptions();
            await load();
            setInterval(() => { if (!document.hidden && !document.querySelector('.modal.show')) load().catch(() => {}); }, 5000);
        }).catch(e => toast(e.message, 'error'));
    });
</script>
</body>
</html>
