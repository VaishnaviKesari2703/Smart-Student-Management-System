<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Profile | Smart Student Management System</title>
    <meta name="description" content="Student profile with attendance details and adjustment history.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="sidebar" aria-label="Main navigation"></nav>
<main class="main">
    <div class="topbar-mobile">
        <button class="btn btn-outline-secondary" id="menu-toggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <strong>Smart Student Management</strong>
    </div>

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
            <h1 class="page-title" id="profile-name">Student Profile</h1>
            <p class="page-sub" id="profile-reg"></p>
        </div>
        <div class="d-flex gap-2">
            <a href="/admin/students.html" class="btn btn-light" id="back-btn"><i class="bi bi-arrow-left me-1"></i>Back</a>
            <a href="#" class="btn btn-brand" id="edit-btn"><i class="bi bi-pencil me-1"></i>Edit</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card-soft h-100"><div class="card-header-soft">Student Information</div>
                <div class="card-body" id="info"></div></div>
        </div>
        <div class="col-lg-7">
            <div class="card-soft h-100"><div class="card-header-soft">Attendance</div>
                <div class="card-body" id="attendance"></div></div>
        </div>
        <div class="col-12">
            <div class="card-soft"><div class="card-header-soft">Attendance History (simulated adjustments)</div>
                <div class="card-body p-0 pt-3"><div class="table-responsive"><table class="table mb-0">
                    <thead><tr><th>Date &amp; Time</th><th>Action</th><th>Previous</th><th>New</th></tr></thead>
                    <tbody id="history"></tbody></table></div></div></div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    const id = new URLSearchParams(location.search).get('id');
    const row = (k, v) => '<div class="info-row"><span>' + k + '</span><span>' + esc(v) + '</span></div>';

    async function load() {
        if (!id) { toast('No student selected.', 'error'); return; }
        const [s, history] = await Promise.all([
            api.get('/api/students/' + encodeURIComponent(id)),
            api.get('/api/attendance/' + encodeURIComponent(id) + '/history')]);
        const a = s.attendance;
        document.getElementById('profile-name').textContent = s.fullName;
        document.getElementById('profile-reg').textContent = s.registrationNumber + ' \u00B7 ' + s.department;
        document.getElementById('edit-btn').href = '/admin/student-form.html?id=' + encodeURIComponent(s.id);
        document.getElementById('info').innerHTML = row('Student ID', s.id) + row('Registration Number', s.registrationNumber) + row('Full Name', s.fullName)
            + row('Email', s.email) + row('Department', s.department) + row('Year', s.year) + row('Semester', s.semester) + row('Username', s.username);
        document.getElementById('attendance').innerHTML =
            '<div class="d-flex align-items-center gap-3 mb-3"><div class="stat-value">' + a.percentage.toFixed(2) + '%</div>' + statusBadge(a) + '</div>'
            + '<div class="progress progress-big mb-4"><div class="progress-bar ' + (a.eligible ? 'bg-eligible' : 'bg-shortage') + '" style="width:' + a.percentage + '%"></div><div class="marker"></div></div>'
            + '<div class="row g-3 mb-3"><div class="col-4"><div class="mini-stat"><div class="v">' + a.totalClasses + '</div><div class="l">Total Classes</div></div></div>'
            + '<div class="col-4"><div class="mini-stat"><div class="v">' + a.classesAttended + '</div><div class="l">Attended</div></div></div>'
            + '<div class="col-4"><div class="mini-stat"><div class="v">' + a.classesMissed + '</div><div class="l">Missed</div></div></div></div>'
            + '<div class="alert ' + (a.eligible ? 'alert-success' : 'alert-danger') + ' mb-0">' + esc(a.message) + '</div>';
        document.getElementById('history').innerHTML = history.length
            ? history.map(h => '<tr><td>' + formatDateTime(h.timestamp) + '</td><td>' + esc(actionLabel(h.action)) + '</td><td>' + h.previousAttendance + '</td><td>' + h.newAttendance + '</td></tr>').join('')
            : '<tr><td colspan="4"><div class="empty-state">No attendance changes recorded yet.</div></td></tr>';
    }
    initLayout('ADMIN', 'students').then(me => { if (me) autoRefresh(load, 5000); })
        .catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
