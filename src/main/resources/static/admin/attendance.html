<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance Monitoring | Smart Student Management System</title>
    <meta name="description" content="Monitor attendance and eligibility of every student.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="sidebar" aria-label="Main navigation"></nav>
<main class="main">
    <div class="topbar-mobile">
        <button class="btn btn-outline-secondary" id="menu-toggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <strong>Smart Student Management</strong>
    </div>

    <div class="mb-4">
        <h1 class="page-title">Attendance Monitoring</h1>
        <p class="page-sub">Classes attended out of 42. Minimum 32 classes (75%) required. <span class="text-success"><i class="bi bi-arrow-repeat"></i> auto-refresh</span></p>
    </div>

    <div class="card-soft mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-5">
                    <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="search" id="search" class="form-control" placeholder="Search by registration number or name"></div>
                </div>
                <div class="col-12 col-md-7">
                    <div class="btn-group" role="group" aria-label="Status filter">
                        <button type="button" class="btn btn-outline-secondary active" data-status="" id="tab-all">All</button>
                        <button type="button" class="btn btn-outline-success" data-status="ELIGIBLE" id="tab-eligible">Eligible</button>
                        <button type="button" class="btn btn-outline-danger" data-status="SHORTAGE" id="tab-shortage">Below 75%</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-soft">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0" id="attendance-table">
                    <thead><tr><th>Registration Number</th><th>Student Name</th><th>Department</th><th>Classes Attended</th><th>Attendance %</th><th>Status</th><th>Additional Classes Needed</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="attendance-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <p class="text-secondary small mt-2" id="result-count"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let status = '';
    async function load() {
        const p = new URLSearchParams();
        const q = document.getElementById('search').value.trim();
        if (q) p.set('q', q);
        if (status) p.set('status', status);
        const list = await api.get('/api/students?' + p.toString());
        document.getElementById('result-count').textContent = list.length + ' student' + (list.length === 1 ? '' : 's') + ' shown';
        const body = document.getElementById('attendance-body');
        if (!list.length) {
            body.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="bi bi-clipboard-x"></i>No students found.</div></td></tr>';
            return;
        }
        body.innerHTML = list.map(s => {
            const a = s.attendance;
            return '<tr><td class="fw-semibold">' + esc(s.registrationNumber) + '</td><td>' + esc(s.fullName) + '</td><td>' + esc(s.department) + '</td>'
                + '<td>' + a.classesAttended + ' / ' + a.totalClasses + '</td>'
                + '<td style="min-width:160px"><div class="fw-semibold mb-1">' + a.percentage.toFixed(2) + '%</div>' + progressBar(a) + '</td>'
                + '<td>' + statusBadge(a) + '</td>'
                + '<td>' + (a.eligible ? '<span class="text-secondary">-</span>' : '<strong class="text-danger">' + a.additionalClassesRequired + '</strong>') + '</td>'
                + '<td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" href="/admin/student-profile.html?id=' + encodeURIComponent(s.id) + '"><i class="bi bi-eye me-1"></i>View</a></td></tr>';
        }).join('');
    }
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('search').addEventListener('input', debounce(() => load().catch(e => toast(e.message, 'error')), 250));
        document.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('[data-status]').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            status = b.dataset.status;
            load().catch(e => toast(e.message, 'error'));
        }));
        initLayout('ADMIN', 'attendance').then(me => { if (me) autoRefresh(load, 5000); })
            .catch(e => toast(e.message, 'error'));
    });
</script>
</body>
</html>
