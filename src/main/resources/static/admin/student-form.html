<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Form | Smart Student Management System</title>
    <meta name="description" content="Add a new student or edit an existing student record.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="sidebar" aria-label="Main navigation"></nav>
<main class="main">
    <div class="topbar-mobile">
        <button class="btn btn-outline-secondary" id="menu-toggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <strong>Smart Student Management</strong>
    </div>

    <div class="mb-4">
        <h1 class="page-title" id="form-title">Add Student</h1>
        <p class="page-sub" id="form-sub">Creates the student record and a login account.</p>
    </div>

    <div class="card-soft" style="max-width:860px">
        <div class="card-body">
            <div id="form-error" class="alert alert-danger d-none" role="alert"></div>
            <form id="student-form" novalidate>
                <div class="row g-3">
                    <div class="col-md-6"><label for="registrationNumber" class="form-label fw-semibold">Registration Number *</label><input class="form-control" id="registrationNumber" name="registrationNumber" maxlength="30" placeholder="e.g. 22BCE1003"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="fullName" class="form-label fw-semibold">Full Name *</label><input class="form-control" id="fullName" name="fullName" maxlength="80"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="email" class="form-label fw-semibold">Email *</label><input type="email" class="form-control" id="email" name="email" maxlength="100"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="department" class="form-label fw-semibold">Department *</label><input class="form-control" id="department" name="department" list="dept-list" maxlength="60"><datalist id="dept-list"></datalist><div class="invalid-feedback"></div></div>
                    <div class="col-md-3"><label for="year" class="form-label fw-semibold">Year *</label><select class="form-select" id="year" name="year"><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><div class="invalid-feedback"></div></div>
                    <div class="col-md-3"><label for="semester" class="form-label fw-semibold">Semester *</label><select class="form-select" id="semester" name="semester"><option value="">Select</option></select><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="username" class="form-label fw-semibold">Username</label><input class="form-control" id="username" name="username" maxlength="40" placeholder="Defaults to registration number"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="password" class="form-label fw-semibold" id="password-label">Password</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="Default: Student@123"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="classesAttended" class="form-label fw-semibold">Classes Attended (0-42)</label><input type="number" class="form-control" id="classesAttended" name="classesAttended" min="0" max="42" step="1" value="0"><div class="invalid-feedback"></div></div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-brand" id="save-btn"><i class="bi bi-check2-circle me-1"></i><span id="save-label">Save Student</span></button>
                    <a href="/admin/students.html" class="btn btn-light" id="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    const editId = new URLSearchParams(location.search).get('id');
    const fields = ['registrationNumber', 'fullName', 'email', 'department', 'year', 'semester', 'username', 'password', 'classesAttended'];
    const $ = id => document.getElementById(id);

    function clearErrors() {
        $('form-error').classList.add('d-none');
        fields.forEach(f => { $(f).classList.remove('is-invalid'); $(f).nextElementSibling && ($(f).closest('div').querySelector('.invalid-feedback').textContent = ''); });
    }
    function showFieldErrors(errs) {
        Object.entries(errs || {}).forEach(([f, msg]) => {
            const el = $(f);
            if (el) { el.classList.add('is-invalid'); el.closest('div').querySelector('.invalid-feedback').textContent = msg; }
        });
    }

    async function init() {
        const me = await initLayout('ADMIN', editId ? 'students' : 'add');
        if (!me) return;
        const sem = $('semester');
        for (let i = 1; i <= 12; i++) sem.insertAdjacentHTML('beforeend', '<option>' + i + '</option>');
        const all = await api.get('/api/students');
        $('dept-list').innerHTML = [...new Set(all.map(s => s.department))].sort().map(d => '<option value="' + esc(d) + '">').join('');
        if (editId) {
            document.title = 'Edit Student | Smart Student Management System';
            $('form-title').textContent = 'Edit Student';
            $('form-sub').textContent = 'Update the student details. Leave the password empty to keep the current one.';
            $('save-label').textContent = 'Update Student';
            $('password').placeholder = 'Leave empty to keep current password';
            const s = await api.get('/api/students/' + encodeURIComponent(editId));
            ['registrationNumber', 'fullName', 'email', 'department', 'year', 'semester', 'username'].forEach(f => $(f).value = s[f]);
            $('classesAttended').value = s.attendance.classesAttended;
        }
    }

    $('student-form').addEventListener('submit', async e => {
        e.preventDefault();
        clearErrors();
        const num = v => v === '' ? null : Number(v);
        const body = {
            registrationNumber: $('registrationNumber').value, fullName: $('fullName').value, email: $('email').value,
            department: $('department').value, year: num($('year').value), semester: num($('semester').value),
            username: $('username').value, password: $('password').value, classesAttended: num($('classesAttended').value)
        };
        $('save-btn').disabled = true;
        try {
            if (editId) await api.put('/api/students/' + encodeURIComponent(editId), body);
            else await api.post('/api/students', body);
            toast(editId ? 'Student updated.' : 'Student added.', 'success');
            setTimeout(() => location.href = '/admin/students.html', 700);
        } catch (err) {
            showFieldErrors(err.fieldErrors);
            const box = $('form-error');
            box.textContent = err.message;
            box.classList.remove('d-none');
            $('save-btn').disabled = false;
        }
    });
    init().catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
